name: Linux TEST ONLY prerelease

on:
  push:
    branches: [awf/linux-ci-test-v1.0.1-rc.1]

permissions: {}

concurrency:
  group: awf-linux-test-release-v1.0.1-rc.1
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'atongrun/agent-workflow' && github.ref == 'refs/heads/awf/linux-ci-test-v1.0.1-rc.1' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned official Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain_dir="$RUNNER_TEMP/awf-go-toolchain"
          mkdir "$toolchain_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --output "$toolchain_dir/go.tar.gz" https://go.dev/dl/go1.25.14.linux-amd64.tar.gz
          test "$(stat -c %s "$toolchain_dir/go.tar.gz")" = 59909419
          printf '%s  %s\n' a21ae5633a269bcd7e90cf767e48225633795e99d831742cbf3397064fee7712 "$toolchain_dir/go.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$toolchain_dir/go.tar.gz" --directory "$toolchain_dir"
          printf '%s\n' "$toolchain_dir/go/bin" >> "$GITHUB_PATH"
      - name: Local source and packaging checks
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          umask 022
          go test ./...
          go test -race ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/awf-windows.exe" ./cmd/awf
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/awf-node-windows.exe" ./cmd/awf-node
          python3 scripts/test_linux_bootstrap.py
          python3 scripts/test_private_native_kit.py
          python3 scripts/test_package_linux.py
          sh -n scripts/install-linux.sh
      - name: Build reviewed source twice and verify official runtime inputs
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          umask 022
          python3 scripts/package_linux.py --output "$RUNNER_TEMP/linux-test-assets" --go "$(command -v go)" --upstream-cache "$RUNNER_TEMP/awf-official-inputs"
          python3 scripts/package_linux.py --verify --output "$RUNNER_TEMP/linux-test-assets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-test-v1.0.1-rc.1-${{ github.sha }}
          path: ${{ runner.temp }}/linux-test-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.repository == 'atongrun/agent-workflow' && github.ref == 'refs/heads/awf/linux-ci-test-v1.0.1-rc.1' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-test-v1.0.1-rc.1-${{ github.sha }}
          path: ${{ runner.temp }}/linux-test-assets
      - name: Publish verified draft as TEST ONLY prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_linux_test.py --assets "$RUNNER_TEMP/linux-test-assets"
