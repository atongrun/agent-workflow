name: One Ubuntu RC4 Pi update diagnosis

on:
  push:
    branches: [awf/linux-pi-update-diagnostic-ci-v2]

permissions: {}
concurrency:
  group: awf-linux-pi-update-diagnostic-ci-v2
  cancel-in-progress: false

jobs:
  native:
    if: github.repository == 'atongrun/agent-workflow' && github.event_name == 'push' && github.ref == 'refs/heads/awf/linux-pi-update-diagnostic-ci-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EVIDENCE: /tmp/awf-pi-update-diagnostic
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record one deadline with cleanup reserve
        run: |
          python3 -c 'import os,time; open(os.environ["GITHUB_ENV"],"a").write("AWF_NATIVE_DEADLINE_EPOCH="+str(int(time.time())+28*60)+"\n")'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761e78c7ea1664fbc96cabc919868ab243ca7cbd
          path: packager
          persist-credentials: false
      - name: Check fixed collector and cleanup boundaries
        run: |
          set -eu
          python3 scripts/test_native_runner_probe.py
          python3 scripts/test_native_acceptance.py
          python3 scripts/test_native_ci_parent.py
          python3 scripts/test_native_startup_diagnostics.py
          python3 scripts/test_native_pi_update_observation.py
      - name: Existing public RC4 fresh install and one official Pi update
        id: diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$EVIDENCE"
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT='${{ runner.environment }}' RUNNER_OS='${{ runner.os }}' \
            GITHUB_REPOSITORY=atongrun/agent-workflow GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME=push GITHUB_SHA="$GITHUB_SHA" \
            AWF_NATIVE_DEADLINE_EPOCH="$AWF_NATIVE_DEADLINE_EPOCH" \
            /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/native_ci_parent.py" \
            --expected-release 24.04 --report "$EVIDENCE/pi-diagnostic-report.json" --pi-update-diagnostic --prepare-ci-parents
      - name: Always finish owned cleanup and restore both parent inodes and modes
        id: cleanup
        if: always() && steps.diagnostic.outcome != 'skipped'
        shell: bash
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT='${{ runner.environment }}' RUNNER_OS='${{ runner.os }}' \
            GITHUB_REPOSITORY=atongrun/agent-workflow GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME=push GITHUB_SHA="$GITHUB_SHA" \
            /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/native_ci_parent.py" \
            --expected-release 24.04 --report "$EVIDENCE/pi-diagnostic-report.json" --cleanup-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: report
        if: always() && steps.diagnostic.outcome != 'skipped'
        with:
          name: linux-pi-update-diagnostic-${{ github.sha }}
          path: ${{ env.EVIDENCE }}/pi-diagnostic-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Report the diagnostic outcome without claiming full acceptance
        if: always()
        run: |
          test '${{ steps.diagnostic.outcome }}' = success
          test '${{ steps.cleanup.outcome }}' = success
          test '${{ steps.report.outcome }}' = success
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["piDiagnosticPassed"] and r["piDiagnosticObserved"] and r["acceptancePassed"] is False and r["cleanup"]["passed"] and r["parentRestoration"]["passed"] and r["parentRestoration"]["privateReceiptRemoved"]' "$EVIDENCE/pi-diagnostic-report.json"
