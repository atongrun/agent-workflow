name: Linux public bootstrap and official update acceptance

on:
  push:
    branches: [awf/linux-upgrade-ci-v1, awf/linux-default-ci-v1]

permissions: {}
concurrency:
  group: awf-linux-upgrade-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  native:
    if: github.repository == 'atongrun/agent-workflow' && github.event_name == 'push' && (github.ref == 'refs/heads/awf/linux-upgrade-ci-v1' || github.ref == 'refs/heads/awf/linux-default-ci-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify harness boundaries without machine mutation
        run: |
          set -eu
          python3 scripts/test_native_runner_probe.py
          python3 scripts/test_native_acceptance.py
          python3 scripts/test_native_ci_parent.py
          python3 scripts/test_linux_channel_gate.py
      - name: Approved remaining VM public installation and actual updates
        id: upgrade
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/awf-linux-upgrade"
          mkdir "$evidence_dir"
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT='${{ runner.environment }}' RUNNER_OS='${{ runner.os }}' \
            GITHUB_REPOSITORY=atongrun/agent-workflow GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME=push GITHUB_SHA="$GITHUB_SHA" \
            /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/native_ci_parent.py" \
            --expected-release 24.04 --report "$evidence_dir/upgrade-report.json" --phase upgrade --prepare-ci-parents
      - name: Complete upgrade cleanup and independently restore both VM parents
        id: upgrade_cleanup
        if: always()
        shell: bash
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT='${{ runner.environment }}' RUNNER_OS='${{ runner.os }}' \
            GITHUB_REPOSITORY=atongrun/agent-workflow GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME=push GITHUB_SHA="$GITHUB_SHA" \
            /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/native_ci_parent.py" \
            --expected-release 24.04 --report "$RUNNER_TEMP/awf-linux-upgrade/upgrade-report.json" --phase upgrade --cleanup-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upgrade_report
        if: always()
        with:
          name: linux-upgrade-phase1-${{ github.sha }}
          path: ${{ runner.temp }}/awf-linux-upgrade/upgrade-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Wait for external verified channel publication
        id: channel
        if: steps.upgrade.outcome == 'success' && steps.upgrade_cleanup.outcome == 'success' && steps.upgrade_report.outcome == 'success'
        run: python3 scripts/wait_linux_channel.py
      - name: Default public installation after complete owned cleanup in this VM
        id: default
        if: steps.channel.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT='${{ runner.environment }}' RUNNER_OS='${{ runner.os }}' \
            GITHUB_REPOSITORY=atongrun/agent-workflow GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME=push GITHUB_SHA="$GITHUB_SHA" \
            /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/native_ci_parent.py" \
            --expected-release 24.04 --phase default --report "$RUNNER_TEMP/awf-linux-upgrade/default-report.json" --prepare-ci-parents
      - name: Default cleanup and independent parent restoration
        if: always() && steps.default.outcome != 'skipped'
        shell: bash
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT='${{ runner.environment }}' RUNNER_OS='${{ runner.os }}' \
            GITHUB_REPOSITORY=atongrun/agent-workflow GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME=push GITHUB_SHA="$GITHUB_SHA" \
            /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/native_ci_parent.py" \
            --expected-release 24.04 --phase default --report "$RUNNER_TEMP/awf-linux-upgrade/default-report.json" --cleanup-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.default.outcome != 'skipped'
        with:
          name: linux-default-phase2-${{ github.sha }}
          path: ${{ runner.temp }}/awf-linux-upgrade/default-report.json
          if-no-files-found: error
          retention-days: 7
