name: Linux RC2 and RC3 preview candidates

on:
  push:
    branches: [awf/linux-preview-release-v1]

permissions: {}
concurrency:
  group: awf-linux-preview-release-v1
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'atongrun/agent-workflow' && github.ref == 'refs/heads/awf/linux-preview-release-v1' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain_dir="$RUNNER_TEMP/awf-preview-go"
          mkdir "$toolchain_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$toolchain_dir/go.tar.gz" https://go.dev/dl/go1.25.14.linux-amd64.tar.gz
          test "$(stat -c %s "$toolchain_dir/go.tar.gz")" = 59909419
          printf '%s  %s\n' a21ae5633a269bcd7e90cf767e48225633795e99d831742cbf3397064fee7712 "$toolchain_dir/go.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$toolchain_dir/go.tar.gz" --directory "$toolchain_dir"
          printf '%s\n' "$toolchain_dir/go/bin" >> "$GITHUB_PATH"
      - name: Verify source and publication boundaries
        env:
          GOTOOLCHAIN: local
        run: |
          set -eu
          umask 022
          go test ./...
          go test -race ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go build -buildvcs=false -o "$RUNNER_TEMP/awf-windows.exe" ./cmd/awf
          GOOS=windows GOARCH=amd64 go build -buildvcs=false -o "$RUNNER_TEMP/awf-node-windows.exe" ./cmd/awf-node
          python3 scripts/test_linux_bootstrap.py
          python3 scripts/test_linux_preview_release.py
          sh -n scripts/install-linux.sh
      - name: Build both immutable candidate versions
        run: |
          set -eu
          for version in v1.0.1-rc.2 v1.0.1-rc.3; do
            python3 scripts/package_linux_preview.py --version "$version" --go "$(command -v go)" --upstream-cache "$RUNNER_TEMP/awf-preview-inputs" --output "$RUNNER_TEMP/awf-preview-assets/$version"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-preview-candidates-${{ github.sha }}
          path: ${{ runner.temp }}/awf-preview-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-preview-candidates-${{ github.sha }}
          path: ${{ runner.temp }}/awf-preview-assets/
      - name: Publish only the two new prereleases without channel promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for version in v1.0.1-rc.2 v1.0.1-rc.3; do
            python3 scripts/publish_linux_preview.py --version "$version" --assets "$RUNNER_TEMP/awf-preview-assets/$version"
          done
