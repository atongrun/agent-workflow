name: Go Host CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main, awf/go-v1, awf/linux-v1, codex/pi-110-health, codex/dash-magpie-provider]
  push:
    branches: [main, awf/go-v1, awf/linux-v1, codex/pi-110-health]
permissions:
  contents: read
concurrency:
  group: go-host-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Go Host checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOENV: 'off'
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Isolated build paths
        run: printf 'GOCACHE=%s\nGOMODCACHE=%s\n' "$RUNNER_TEMP/go-host-build" "$RUNNER_TEMP/go-host-modules" >> "$GITHUB_ENV"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.GOCACHE }}
          key: go-host-${{ runner.os }}-${{ runner.arch }}-1.27.1-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Vet and all package tests once
        run: |
          test "$(go env GOVERSION)" = "go1.27.1"
          go vet -mod=readonly ./...
          go test -mod=readonly -race -count=1 -timeout=5m ./...
      - name: Current Linux command binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/go-host-bin"
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/go-host-bin/awf" ./cmd/awf
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/go-host-bin/awf-node" ./cmd/awf-node
      - name: Portable package and bootstrap contracts
        run: python3 scripts/test_package_windows.py
      - name: Package tested Linux binaries
        env:
          BUILD_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/go-host-bin/SOURCE_COMMIT"
          printf '%s\n' "$BUILD_HEAD_COMMIT" > "$RUNNER_TEMP/go-host-bin/HEAD_COMMIT"
          tar -czf "$RUNNER_TEMP/go-host-build.tar.gz" -C "$RUNNER_TEMP/go-host-bin" .
          cd "$RUNNER_TEMP"
          sha256sum go-host-build.tar.gz > go-host-build.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: go-host-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/go-host-build.tar.gz
            ${{ runner.temp }}/go-host-build.sha256
          retention-days: 1
          if-no-files-found: error
