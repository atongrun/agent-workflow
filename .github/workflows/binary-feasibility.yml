name: Binary Feasibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-candidates:
    name: native-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: windows-x86_64
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-14
            target: macos-arm64
    env:
      AWF_BUILD_ROOT: binary-feasibility-build
      AWF_EVIDENCE_ROOT: binary-feasibility-evidence
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned disposable Agent Bus peer
        uses: actions/checkout@v4
        with:
          repository: atongrun/agent-bus
          ref: 6ca8f2812be0286607bbbe3f14cc51783637b0b5
          path: agent-bus-peer
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install ephemeral feasibility tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pyinstaller pex
          python -m pip install . ./agent-bus-peer

      - name: Check the experimental Go source format
        run: |
          gofmt -w experiments/binary-feasibility/main.go
          git diff --exit-code -- experiments/binary-feasibility/main.go

      - name: Build the three native candidates
        run: >-
          python experiments/binary-feasibility/verify.py build
          --repo .
          --output "${{ env.AWF_BUILD_ROOT }}"

      - name: Measure PyInstaller one-folder
        run: >-
          python experiments/binary-feasibility/verify.py collect
          --candidate pyinstaller-onedir
          --target ${{ matrix.target }}
          --build-root "${{ env.AWF_BUILD_ROOT }}"
          --output "${{ env.AWF_EVIDENCE_ROOT }}/pyinstaller-onedir-${{ matrix.target }}.json"

      - name: Measure PEX scie eager
        run: >-
          python experiments/binary-feasibility/verify.py collect
          --candidate pex-scie-eager
          --target ${{ matrix.target }}
          --build-root "${{ env.AWF_BUILD_ROOT }}"
          --output "${{ env.AWF_EVIDENCE_ROOT }}/pex-scie-eager-${{ matrix.target }}.json"

      - name: Measure Go launcher plus versioned PEX app
        run: >-
          python experiments/binary-feasibility/verify.py collect
          --candidate go-launcher-pex-app
          --target ${{ matrix.target }}
          --build-root "${{ env.AWF_BUILD_ROOT }}"
          --output "${{ env.AWF_EVIDENCE_ROOT }}/go-launcher-pex-app-${{ matrix.target }}.json"

      - name: Exercise a disposable localhost SQLite Agent Bus
        run: python agent-bus-peer/scripts/test-client-setup.py

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awf-binary-candidates-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ env.AWF_BUILD_ROOT }}/pyinstaller/awf-pyinstaller
            ${{ env.AWF_BUILD_ROOT }}/pex
            ${{ env.AWF_BUILD_ROOT }}/go
            ${{ env.AWF_BUILD_ROOT }}/sbom.cdx.json
            ${{ env.AWF_BUILD_ROOT }}/tooling.json

      - name: Upload machine-readable evidence
        uses: actions/upload-artifact@v4
        with:
          name: awf-binary-evidence-${{ matrix.target }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ env.AWF_EVIDENCE_ROOT }}/*.json

  rust-shared-slice:
    name: rust-shared-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: windows-x86_64
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-14
            target: macos-arm64
    env:
      AWF_RUST_EVIDENCE_ROOT: rust-shared-evidence
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.85.1 --profile minimal

      - name: Build the disposable Rust shared slice
        shell: bash
        run: cargo build --manifest-path experiments/runtime-v2-rust/Cargo.toml --release --locked

      - name: Run the complete Rust shared semantic suite
        shell: bash
        run: cargo test --manifest-path experiments/runtime-v2-rust/Cargo.toml --locked

      - name: Exercise unrelated-cwd run status replay stop evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AWF_RUST_EVIDENCE_ROOT}"
          exe="experiments/runtime-v2-rust/target/release/runtime-v2-rust"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            exe="${exe}.exe"
          fi
          "${exe}" verify \
            --fixture tests/fixtures/runtime_v2_shared_slice_cases.json \
            --state "${RUNNER_TEMP}/rust shared state" \
            --repo . \
            --target "${{ matrix.target }}" \
            --evidence "${AWF_RUST_EVIDENCE_ROOT}/rust-shared-${{ matrix.target }}.json"

      - name: Upload Rust shared executable
        uses: actions/upload-artifact@v4
        with:
          name: awf-rust-shared-executable-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
          path: |
            experiments/runtime-v2-rust/target/release/runtime-v2-rust
            experiments/runtime-v2-rust/target/release/runtime-v2-rust.exe

      - name: Upload Rust shared evidence
        uses: actions/upload-artifact@v4
        with:
          name: awf-rust-shared-evidence-${{ matrix.target }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ env.AWF_RUST_EVIDENCE_ROOT }}/*.json

  aggregate:
    name: aggregate-go-no-go-input
    needs:
      - native-candidates
      - rust-shared-slice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download native evidence only
        uses: actions/download-artifact@v4
        with:
          pattern: awf-binary-evidence-*
          path: ${{ runner.temp }}/awf-binary-evidence
          merge-multiple: true

      - name: Require the complete candidate and target matrix
        run: >-
          python experiments/binary-feasibility/verify.py summarize
          --input "${{ runner.temp }}/awf-binary-evidence"
          --output "${{ runner.temp }}/awf-binary-summary.json"

      - name: Upload deterministic decision input
        uses: actions/upload-artifact@v4
        with:
          name: awf-binary-feasibility-summary
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/awf-binary-summary.json

      - name: Download Rust shared evidence only
        uses: actions/download-artifact@v4
        with:
          pattern: awf-rust-shared-evidence-*
          path: ${{ runner.temp }}/awf-rust-shared-evidence
          merge-multiple: true

      - name: Require complete Rust shared evidence matrix
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = process.env.RUNNER_TEMP + '/awf-rust-shared-evidence';
          const expected = new Set([
            'linux-x86_64',
            'linux-arm64',
            'windows-x86_64',
            'macos-x86_64',
            'macos-arm64',
          ]);
          const seen = new Set();
          const files = fs.readdirSync(path).filter((name) => name.endsWith('.json'));
          for (const file of files) {
            const raw = fs.readFileSync(`${path}/${file}`, 'utf8');
            const evidence = JSON.parse(raw);
            const target = evidence.target;
            if (!expected.has(target)) throw new Error(`unexpected target ${target}`);
            if (seen.has(target)) throw new Error(`duplicate target ${target}`);
            seen.add(target);
            if (evidence.format !== 'awf.runtime-v2-rust-evidence.v1') throw new Error(`${target} format drift`);
            if (evidence.actual_target !== target) throw new Error(`${target} target drift`);
            if (evidence.case_count !== 14) throw new Error(`${target} case count drift`);
            if (!Array.isArray(evidence.case_rows) || evidence.case_rows.length !== 14) {
              throw new Error(`${target} case row drift`);
            }
            if (!Array.isArray(evidence.startup_samples_ms) || evidence.startup_samples_ms.length !== 5) {
              throw new Error(`${target} startup sample drift`);
            }
            if (evidence.python_invoked !== false) throw new Error(`${target} invoked Python`);
            if (evidence.child_argv_no_shell !== true) throw new Error(`${target} shell boundary drift`);
            if (evidence.direct_dependency_count !== 0 || evidence.transitive_dependency_count !== 0) {
              throw new Error(`${target} dependency drift`);
            }
            if (typeof evidence.executable_sha256 !== 'string' || !/^[0-9a-f]{64}$/.test(evidence.executable_sha256)) {
              throw new Error(`${target} executable sha drift`);
            }
          }
          for (const target of expected) {
            if (!seen.has(target)) throw new Error(`missing target ${target}`);
          }
          NODE
